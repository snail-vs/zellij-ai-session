name: Bug report
description: Report installation, discovery, search, resume, or compatibility problems
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not upload raw session files or prompts. Redact usernames, paths, private repository names, tokens, and other secrets.
  - type: input
    id: version
    attributes:
      label: zellij-ai-session version
      placeholder: v0.1.6
    validations:
      required: true
  - type: input
    id: zellij
    attributes:
      label: Zellij version
      placeholder: zellij 0.44.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x86_64
        - aarch64 / Apple Silicon
        - Other
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Affected agent and version
      placeholder: Codex 0.x, OpenCode 1.x, Claude Code 2.x
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - One-line installer
        - Pinned installer
        - From source
        - Manual installation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the navigator with Alt+s
        2. Select ...
        3. Press ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add a redacted config excerpt, error message, or screenshot if useful.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed prompts, credentials, usernames, private paths, and repository names.
          required: true

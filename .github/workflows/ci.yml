name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace

      - name: Build native indexer
        run: cargo build -p zellij-ai-session-index --release

      - name: Build WASI plugin
        run: >-
          cargo build
          -p zellij-ai-session-plugin
          --target wasm32-wasip1
          --features wasm
          --release

      - name: Check installer scripts
        run: |
          bash -n install.sh
          bash -n uninstall.sh

      - name: Check whitespace errors
        run: git diff --check

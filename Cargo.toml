[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/indexer",
    "crates/indexer-cli",
    "crates/plugin",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zellij-tile = "0.44.3"
